# Manual backfill of Dukascopy 1m history (research only) into
# data_external/dukascopy/. Start it from the Actions tab ("Run workflow").
# One job per pair, in parallel. Each job commits after every 30-minute
# chunk, so progress is kept if a job stops; running the workflow again
# continues where it stopped.
name: Backfill Dukascopy history

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history to keep (newest first)"
        default: "5"
      chunks:
        description: "Number of 30-minute chunks per pair"
        default: "10"
      symbols:
        description: "JSON list of Deriv symbols to fetch"
        default: '["frxEURUSD", "frxGBPUSD", "frxUSDJPY"]'
      end:
        description: "Last day to fetch (YYYY-MM-DD; blank = yesterday)"
        default: ""

permissions:
  contents: write

concurrency:
  group: dukascopy-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        symbol: ${{ fromJSON(inputs.symbols) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Download in chunks and commit each one
        env:
          YEARS: ${{ inputs.years }}
          CHUNKS: ${{ inputs.chunks }}
          SYMBOL: ${{ matrix.symbol }}
          END: ${{ inputs.end }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 "$CHUNKS"); do
            rc=0   # 0 = complete, 2 = time limit (run again), 1 = error
            python scripts/collect_dukascopy.py --symbols "$SYMBOL" --years "$YEARS" --max-minutes 30 ${END:+--end "$END"} || rc=$?
            git add "data_external/dukascopy/$SYMBOL"
            if ! git diff --cached --quiet; then
              git commit -q -m "Dukascopy 1m history for $SYMBOL (chunk $i)"
              for try in 1 2 3 4 5; do
                git pull -q --rebase origin main && git push -q origin HEAD:main && break
                [ "$try" -eq 5 ] && { echo "::error::Push failed"; exit 1; }
                sleep $((RANDOM % 20 + 5))
              done
            fi
            [ "$rc" -eq 2 ] && continue
            [ "$rc" -eq 0 ] && { echo "Backfill of $SYMBOL complete."; exit 0; }
            echo "::error::Collector failed (exit $rc)"; exit 1
          done
          echo "::warning::Chunks used up; run the workflow again to continue."
