# Daily Deriv candle update. Runs after each weekday's forex close (Friday
# closes at 20:55 GMT, other days at midnight), saves yesterday's candles and
# commits only new files. No secrets needed: public market data only.
name: Collect Deriv candles

on:
  schedule:
    - cron: "15 0 * * 2-6"  # 00:15 UTC Tuesday-Saturday (GitHub often starts it hours late)
    - cron: "40 7 * * 2-6"  # backup in case GitHub drops a scheduled run; saves only missing days
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # Prices are collected and committed FIRST, so no test failure can ever stop data
      # collection (on 3-4 Nov 2026 a date-dependent test blocked it). Tests run afterwards
      # and only send an alert.
      - name: Collect candles and commit new files
        id: collect
        run: |
          set -uo pipefail
          rc=0   # 0 = complete, 2 = time limit (partial), 1 = error
          python scripts/collect_candles.py --max-minutes 30 || rc=$?
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new candles."
          else
            git diff --cached --stat | tail -1
            git commit -q -m "Deriv candles up to $(date -u -d yesterday +%F)"
            for try in 1 2 3; do
              git pull -q --rebase origin main && git push -q origin HEAD:main && break
              [ "$try" -eq 3 ] && { echo "::error::Push failed"; exit 1; }
              sleep 10
            done
          fi
          # Saved days are committed above; now fail the run loudly on errors.
          [ "$rc" -eq 1 ] && { echo "::error::Collector failed"; exit 1; }
          [ "$rc" -eq 2 ] && echo "::warning::Time limit reached; the next run continues."
          exit 0

      - name: Tests (alert only; the new candles are already saved)
        id: tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        # A changed incubator candidate is checked by the forward test, not here.
        run: python -m pytest -q --deselect tests/test_incubator_registry.py::test_real_registry_is_intact

      - name: Telegram alert on test failure
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/incubator.py notify --text "ALERT: a test failed in today's Deriv collector run. The new candles WERE saved (collection runs before the tests), so nothing is lost and the forward test still runs. A developer or AI should look at the failing test. Run: $RUN_URL"

      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/incubator.py notify --text "ALERT: the daily Deriv collector failed. New candles were not (all) saved, so the forward test may be missing days. It retries by itself next run. If this repeats 2-3 days, see incubator/README.md 'Alerts'. Run: $RUN_URL"
