  proposals_20261028T1622Z_manual_public.jsonl.gz: 2026-10-28 16:22Z
  proposals_20261028T1630Z_manual_public.jsonl.gz: 2026-10-28 16:30Z
  proposals_20261028T1633Z_actions.jsonl.gz: 2026-10-28 16:33Z
