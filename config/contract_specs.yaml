  proposals_20261028T1807Z_quotes_real.jsonl.gz: 2026-10-28 18:07Z
notes:
  multiplier_list_depends_on_connection: The public (no login) connection quotes 50/100/150/250/500. The
    demo account's own connection quotes and buys 100/200/300/500/800 (= contracts_for) and refuses 50/150/250
    even on a direct buy. The real account (quotes only, 2026-10-28) offers the same list as demo.
  stop_loss_minimum: Deriv reports stop-loss min = commission + 0.01, but rejects exactly that value when
    the float sum is not exact (0.2 + 0.01 = 0.21000000000000002). Use stop loss >= commission + 0.02.
  real_commission: 'The real account''s commission rate is 3x the demo rate on every pair (2026-10-28
    18:07Z: EUR/USD 0.0717% vs 0.0239%). Multipliers, stake and TP/SL limits are the same. Demo trades
    show the mechanics but understate the cost: backtests must use the real rate.'
  entry_fill: Entry spot is the tick mid price ('quote'), within 0.0-0.5 pip of the quoted spot.
  manual_sell: sell with price 0 filled exactly at the last bid_price seen in proposal_open_contract.
  tp_sl_close: Deriv checks TP/SL against the mid price on each tick and closes at the first tick at or
    past the level, at that tick's mid. A jump past a stop loss costs the size of the jump (0.6 pip seen).
  status_field: Contracts Deriv closes itself (TP/SL/stop out) come back with status null and is_sold
    1.
formulas:
  position_size: stake * multiplier
  commission: max(0.02, rate * stake * multiplier), unrounded; shown rounded to cents
  profit: stake * multiplier * (+/-)(exit - entry) / entry - commission, rounded to the nearest cent,
    floor -stake
  stop_out_price: entry * (1 -/+ (stake - commission) / (stake * multiplier)), rounded to pip size away
    from entry
  take_profit_price: entry * (1 +/- (take_profit + commission) / (stake * multiplier))
  stop_loss_price: entry * (1 -/+ (stop_loss - commission) / (stake * multiplier))
  sign: first sign for MULTUP, second for MULTDOWN
